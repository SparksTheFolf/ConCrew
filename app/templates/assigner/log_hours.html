{% extends "base.html" %}
{% block title %}Log Hours{% endblock %}
{% block content %}
<h3>Log Volunteer Hours</h3>

{% if not con_year %}
  <div class="alert alert-warning">No active con year set. Ask an admin to mark one current before logging hours.</div>
{% else %}

<form method="POST" class="card card-body bg-white" style="max-width: 500px;"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label">Volunteer</label>
    <select name="volunteer_id" class="form-select" required>
      {% for v in volunteers %}
        <option value="{{ v.id }}" {{ "selected" if preselect_volunteer_id == v.id else "" }}>{{ v.badge_name }} ({{ v.full_name }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Department</label>
    <select name="department_id" class="form-select" required>
      {% for d in departments %}
        <option value="{{ d.id }}" {{ "selected" if preselect_department_id == d.id else "" }}>{{ d.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Date</label>
    <input type="date" name="work_date" class="form-control" value="{{ prefill_work_date or '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Hours</label>
    <input type="number" step="0.25" min="0" name="hours" class="form-control" value="{{ prefill_hours if prefill_hours is not none else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Task description (optional)</label>
    <input type="text" name="task_description" class="form-control" value="{{ prefill_task_description or '' }}">
  </div>
  <button class="btn btn-primary">Submit for Approval</button>
</form>

{% endif %}
{% endblock %}
